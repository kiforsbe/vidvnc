<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VidVNC promo, 3D look test</title>
    <!-- An optional WebGL (Three.js) look at three shots; promo.mjs look3d renders it. Best on a real GPU. -->
    <style>
      @font-face {
        font-family: 'Instrument Sans';
        font-weight: 400 700;
        src: url(assets/fonts/instrument-sans-latin-wght-normal.woff2) format('woff2');
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-weight: 500;
        src: url(assets/fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2');
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #05070d;
      }
      body {
        font-family: 'Instrument Sans', system-ui, sans-serif;
        color: #e8edf7;
      }
      canvas {
        position: absolute;
        inset: 0;
      }
      #ui {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .t {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font-weight: 600;
        letter-spacing: -0.5px;
      }
      .lbl {
        position: absolute;
        transform: translate(-50%, -50%);
        font-weight: 600;
        white-space: nowrap;
      }
      .mono {
        font-family: 'JetBrains Mono', monospace;
      }
      .note {
        position: absolute;
        right: 40px;
        bottom: 30px;
        font-size: 18px;
        color: #8693ab;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="ui"></div>
    <script type="module">
      import * as THREE from 'three';
      import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
      import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
      import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
      import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
      import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

      const W = 1920,
        H = 1080;
      const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
      const ease = (x) => {
        x = clamp(x);
        return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
      };
      const lerp = (a, b, x) => a + (b - a) * x;
      const UI = document.getElementById('ui');
      const div = (cls, css = {}, html = '') => {
        const e = document.createElement('div');
        e.className = cls;
        Object.assign(e.style, css);
        e.innerHTML = html;
        UI.appendChild(e);
        return e;
      };
      const loadImg = (src) =>
        new Promise((r) => {
          const i = new Image();
          i.onload = () => r(i);
          i.src = src;
        });

      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(W, H);
      renderer.setPixelRatio(1);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      document.body.prepend(renderer.domElement);
      const pmrem = new THREE.PMREMGenerator(renderer);
      const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

      /* ---------- the shared desktop, drawn on a 2D canvas at any moment ---------- */
      const winImg = await loadImg('assets/mac/overview-dark.png');
      function makeDesk() {
        const c = document.createElement('canvas');
        c.width = 1280;
        c.height = 800;
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = 8;
        return { c, g: c.getContext('2d'), tex };
      }
      const winPos = (time) => ({
        x: 96 + 304 * (0.5 - 0.5 * Math.cos(time * 1.15)),
        y: 56 + 120 * (0.5 - 0.5 * Math.cos(time * 0.83)),
      });
      function drawDesk(d, time, degraded = false) {
        const g = d.g,
          w = 1280,
          h = 800;
        let grd = g.createLinearGradient(0, 0, w, h);
        grd.addColorStop(0, '#1b2a52');
        grd.addColorStop(1, '#0f1730');
        g.fillStyle = grd;
        g.fillRect(0, 0, w, h);
        for (const [x, y, r, col] of [
          [320, 240, 520, 'rgba(59,91,219,0.9)'],
          [1020, 600, 560, 'rgba(112,72,232,0.85)'],
        ]) {
          const rg = g.createRadialGradient(x, y, 0, x, y, r);
          rg.addColorStop(0, col);
          rg.addColorStop(1, 'rgba(0,0,0,0)');
          g.fillStyle = rg;
          g.fillRect(0, 0, w, h);
        }
        g.fillStyle = 'rgba(10,15,28,0.55)';
        g.fillRect(0, 0, w, 24);
        // video player
        const px = 704,
          py = 376,
          pw = 496,
          ph = 336;
        g.save();
        g.beginPath();
        g.roundRect(px, py, pw, ph, 12);
        g.clip();
        const hue = (time * 35) % 360;
        grd = g.createLinearGradient(px, py, px + pw, py + ph);
        grd.addColorStop(0, `hsl(${hue},70%,22%)`);
        grd.addColorStop(1, `hsl(${(hue + 80) % 360},70%,12%)`);
        g.fillStyle = grd;
        g.fillRect(px, py, pw, ph);
        g.globalCompositeOperation = 'screen';
        for (let i = 0; i < 4; i++) {
          const a = time * (1.6 + i * 0.45) + i * 1.7,
            r = 100 + i * 16;
          const cx = px + 248 + Math.cos(a) * (96 + i * 24) - i * 16,
            cy = py + 150 + Math.sin(a * 1.3) * (64 + i * 8);
          const rg = g.createRadialGradient(cx, cy, 0, cx, cy, r);
          rg.addColorStop(0, `hsl(${(hue + i * 70) % 360},95%,62%)`);
          rg.addColorStop(1, 'rgba(0,0,0,0)');
          g.fillStyle = rg;
          g.fillRect(px, py, pw, ph);
        }
        g.globalCompositeOperation = 'source-over';
        g.fillStyle = 'rgba(255,255,255,0.85)';
        for (let i = 0; i < 14; i++) {
          const bh = 24 + 88 * Math.abs(Math.sin(time * (3.1 + i * 0.37) + i));
          g.fillRect(px + 24 + i * 32, py + ph - 56 - bh, 20, bh);
        }
        g.fillStyle = '#11151f';
        g.fillRect(px, py + ph - 36, pw, 36);
        g.fillStyle = '#333';
        g.fillRect(px + 16, py + ph - 20, pw - 32, 4);
        g.fillStyle = '#fff';
        g.fillRect(px + 16, py + ph - 20, (pw - 32) * ((time * 0.015) % 1), 4);
        g.restore();
        // app window being dragged
        const p = winPos(time);
        g.save();
        g.shadowColor = 'rgba(0,0,0,0.5)';
        g.shadowBlur = 40;
        g.shadowOffsetY = 20;
        g.beginPath();
        g.roundRect(p.x, p.y, 560, 473, 12);
        g.fillStyle = '#222';
        g.fill();
        g.restore();
        g.save();
        g.beginPath();
        g.roundRect(p.x, p.y, 560, 473, 12);
        g.clip();
        g.drawImage(winImg, p.x, p.y, 560, 473);
        g.restore();
        if (degraded) {
          // the traditional client: coarse blocks and washed-out colour
          g.imageSmoothingEnabled = false;
          g.drawImage(d.c, 0, 0, w, h, 0, 0, w / 5, h / 5);
          g.drawImage(d.c, 0, 0, w / 5, h / 5, 0, 0, w, h);
          g.imageSmoothingEnabled = true;
          g.fillStyle = 'rgba(40,40,60,0.18)';
          g.fillRect(0, 0, w, h);
        }
        d.tex.needsUpdate = true;
      }
      const vncTime = (t) => {
        const step = 0.2 + 0.12 * Math.abs(Math.sin(Math.floor(t * 3)));
        return Math.floor((t - 0.45) / step) * step;
      };

      /* ---------- a phone: rounded slab, glass screen ---------- */
      function makePhone(desk) {
        const grp = new THREE.Group();
        const body = new THREE.Mesh(
          new RoundedBoxGeometry(3.4, 1.62, 0.16, 6, 0.2),
          new THREE.MeshPhysicalMaterial({
            color: 0x1a2236,
            metalness: 0.9,
            roughness: 0.28,
            envMap: envTex,
            envMapIntensity: 1.2,
            clearcoat: 1,
          }),
        );
        grp.add(body);
        const bezel = new THREE.Mesh(
          new RoundedBoxGeometry(3.28, 1.5, 0.02, 4, 0.16),
          new THREE.MeshBasicMaterial({ color: 0x000000 }),
        );
        bezel.position.z = 0.081;
        grp.add(bezel);
        const sh = 1.42,
          sw = sh * 1.6;
        const screen = new THREE.Mesh(
          new THREE.PlaneGeometry(sw, sh),
          new THREE.MeshBasicMaterial({ map: desk.tex, toneMapped: false }),
        );
        screen.position.z = 0.092;
        grp.add(screen);
        const glass = new THREE.Mesh(
          new THREE.PlaneGeometry(3.22, 1.46),
          new THREE.MeshBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.025,
            depthWrite: false,
          }),
        );
        glass.position.z = 0.096;
        grp.add(glass);
        return { grp, screen, sw, sh };
      }

      /* ---------- shots ---------- */
      const shots = [];
      function shot(start, end, build) {
        const s = { start, end, ...build() };
        shots.push(s);
        return s;
      }

      // A: the race, in 3D
      shot(0, 7, () => {
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05070d);
        scene.environment = envTex;
        scene.fog = new THREE.Fog(0x05070d, 8, 18);
        const cam = new THREE.PerspectiveCamera(32, W / H, 0.1, 100);
        const dL = makeDesk(),
          dR = makeDesk();
        const L = makePhone(dL),
          R = makePhone(dR);
        L.grp.position.set(-1.95, 0.95, 0);
        R.grp.position.set(1.95, 0.95, 0);
        L.grp.rotation.y = 0.12;
        R.grp.rotation.y = -0.12;
        scene.add(L.grp, R.grp);
        // glossy floor that picks up the screens' glow
        const floor = new THREE.Mesh(
          new THREE.PlaneGeometry(40, 40),
          new THREE.MeshStandardMaterial({
            color: 0x070a12,
            metalness: 0.6,
            roughness: 0.35,
            envMap: envTex,
            envMapIntensity: 0.3,
          }),
        );
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);
        const glowR = new THREE.PointLight(0x5b7cff, 6, 6, 2);
        glowR.position.set(1.95, 0.6, 0.8);
        scene.add(glowR);
        const glowL = new THREE.PointLight(0x6b5cc8, 3, 6, 2);
        glowL.position.set(-1.95, 0.6, 0.8);
        scene.add(glowL);
        const rim = new THREE.DirectionalLight(0x8db8ff, 1.2);
        rim.position.set(0, 4, -5);
        scene.add(rim);
        const lblL = div('lbl', { fontSize: '40px', color: '#a9b5ca' }, 'Traditional VNC');
        const lblR = div('lbl', { fontSize: '40px', color: '#8db8ff' }, 'VidVNC');
        const note = div('note', {}, 'Illustration · the 63 ms figure is measured');
        const ui = [lblL, lblR, note];
        const proj = (obj, dy) => {
          cam.updateMatrixWorld();
          const v = new THREE.Vector3(0, dy, 0);
          obj.localToWorld(v);
          v.project(cam);
          return [((v.x + 1) / 2) * W, ((1 - v.y) / 2) * H];
        };
        return {
          scene,
          cam,
          ui,
          update(lt) {
            const a = lerp(-0.35, 0.3, ease(lt / 7));
            cam.position.set(Math.sin(a) * 10.5, lerp(3.0, 2.1, ease(lt / 7)), Math.cos(a) * 10.5);
            cam.lookAt(0, 0.85, 0);
            const t = lt + 14;
            drawDesk(dL, vncTime(t), true);
            drawDesk(dR, t - 0.063);
            glowR.intensity = 5 + 2 * Math.abs(Math.sin(t * 6));
            for (const [lbl, ph] of [
              [lblL, L.grp],
              [lblR, R.grp],
            ]) {
              const [x, y] = proj(ph, 1.15);
              lbl.style.left = x + 'px';
              lbl.style.top = y + 'px';
              lbl.style.opacity = ease((lt - 0.6) / 0.6);
            }
          },
        };
      });

      // B: the walls, as glowing frames in depth
      shot(7, 15, () => {
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x04060b);
        const cam = new THREE.PerspectiveCamera(40, W / H, 0.1, 200);
        const names = [
          'You decide who gets in',
          'Everything is encrypted',
          'One locked door',
          'A sealed room for the network',
        ];
        const frames = names.map((n, i) => {
          const w = 9.2 - i * 1.7,
            h = 5.2 - i * 0.95,
            r = 0.5,
            sh = new THREE.Shape();
          sh.moveTo(-w / 2 + r, -h / 2);
          sh.lineTo(w / 2 - r, -h / 2);
          sh.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r);
          sh.lineTo(w / 2, h / 2 - r);
          sh.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2);
          sh.lineTo(-w / 2 + r, h / 2);
          sh.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r);
          sh.lineTo(-w / 2, -h / 2 + r);
          sh.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2);
          const pts = sh.getPoints(24).map((p) => new THREE.Vector3(p.x, p.y, 0));
          const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.01);
          const tube = new THREE.Mesh(
            new THREE.TubeGeometry(curve, 400, 0.028, 8, true),
            new THREE.MeshBasicMaterial({
              color: new THREE.Color(0.25, 0.5, 1.6),
              toneMapped: false,
              transparent: true,
            }),
          );
          const plate = new THREE.Mesh(
            new THREE.ShapeGeometry(sh),
            new THREE.MeshBasicMaterial({
              color: 0x2f6feb,
              transparent: true,
              opacity: 0.035,
              depthWrite: false,
            }),
          );
          const g = new THREE.Group();
          g.add(tube, plate);
          g.position.z = -i * 1.4;
          scene.add(g);
          const lbl = div('lbl', { fontSize: '30px', transform: 'translate(0, -50%)' }, n);
          return { g, tube, plate, lbl, w, h };
        });
        // the desktop at the core
        const core = new THREE.Mesh(
          new RoundedBoxGeometry(2.2, 1.375, 0.06, 4, 0.08),
          new THREE.MeshBasicMaterial({
            color: new THREE.Color(0.35, 0.6, 1.8),
            toneMapped: false,
          }),
        );
        core.position.z = -5.6;
        scene.add(core);
        const coreD = makeDesk();
        const coreS = new THREE.Mesh(
          new THREE.PlaneGeometry(2.08, 1.3),
          new THREE.MeshBasicMaterial({ map: coreD.tex, toneMapped: false }),
        );
        coreS.position.z = -5.56;
        scene.add(coreS);
        // packets: blue ones carry the key and pass, red ones bounce off the outer wall
        const N = 26,
          seeds = [...Array(N)].map((_, i) => ({
            y: (((i * 7919) % 100) / 100) * 4 - 2,
            x: (((i * 104729) % 100) / 100) * 8 - 4,
            d: (((i * 31) % 17) / 17) * 3,
            red: i % 3 === 0,
          }));
        const pk = seeds.map((s) => {
          const m = new THREE.Mesh(
            new THREE.SphereGeometry(0.03, 10, 10),
            new THREE.MeshBasicMaterial({
              color: s.red ? new THREE.Color(1.4, 0.3, 0.3) : new THREE.Color(0.45, 0.7, 1.3),
              toneMapped: false,
            }),
          );
          scene.add(m);
          return m;
        });
        const proj = (v) => {
          cam.updateMatrixWorld();
          const p = v.clone().project(cam);
          return [((p.x + 1) / 2) * W, ((1 - p.y) / 2) * H];
        };
        return {
          scene,
          cam,
          ui: frames.map((f) => f.lbl),
          update(lt) {
            cam.position.set(
              lerp(-5.5, 1.2, ease(lt / 8)),
              lerp(3.2, 0.5, ease(lt / 8)),
              lerp(12.5, 9.6, ease(lt / 8)),
            );
            cam.lookAt(0, 0, -3);
            frames.forEach((f, i) => {
              const k = ease((lt - (0.4 + i * 1.3)) / 0.9);
              f.g.scale.setScalar(lerp(1.6, 1, k));
              f.tube.material.opacity = k;
              f.plate.material.opacity = 0.04 * k;
              const [x, y] = proj(
                new THREE.Vector3(
                  (-f.w / 2 + 0.3) * f.g.scale.x,
                  (f.h / 2 - 0.38) * f.g.scale.y,
                  f.g.position.z,
                ),
              );
              f.lbl.style.left = x + 'px';
              f.lbl.style.top = y + 'px';
              f.lbl.style.opacity = k;
              f.lbl.style.fontSize = 34 - i * 2 + 'px';
            });
            drawDesk(coreD, lt + 40);
            seeds.forEach((s, i) => {
              const u = ((lt * 0.35 + s.d) % 3) / 3; // 0 -> 1 travel from far out towards the core
              let z = lerp(9, -5.4, u);
              const m = pk[i];
              if (s.red && z < 0.25) z = 0.25 + (0.25 - z) * 0.8; // bounced back by the outer wall
              m.position.set(s.x * (1 - u * 0.9), s.y * (1 - u * 0.9), z);
              m.visible = lt > 5.6 && z < 8.5 && (!s.red || z < 3);
            });
          },
        };
      });

      // C: end card over drifting light
      shot(15, 20, () => {
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05070d);
        const cam = new THREE.PerspectiveCamera(50, W / H, 0.1, 200);
        cam.position.set(0, 0, 10);
        const n = 1500,
          pos = new Float32Array(n * 3);
        for (let i = 0; i < n; i++) {
          pos[i * 3] = ((Math.sin(i * 12.9898) * 43758.5453) % 1) * 40;
          pos[i * 3 + 1] = ((Math.sin(i * 78.233) * 12345.678) % 1) * 24;
          pos[i * 3 + 2] = -((i * 0.618) % 1) * 60;
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const pts = new THREE.Points(
          geo,
          new THREE.PointsMaterial({
            color: new THREE.Color(0.4, 0.65, 1.6),
            size: 0.06,
            toneMapped: false,
            transparent: true,
            opacity: 0.9,
          }),
        );
        scene.add(pts);
        const icon = div('', {
          position: 'absolute',
          left: '880px',
          top: '250px',
          width: '160px',
          height: '160px',
          background: 'url(assets/icon.png) center/contain no-repeat',
          filter: 'drop-shadow(0 0 40px rgba(47,111,235,0.7))',
        });
        const t1 = div('t', { top: '450px', fontSize: '104px' }, 'VidVNC');
        const t2 = div(
          't',
          { top: '590px', fontSize: '38px', fontWeight: 400 },
          'Your desktop, in real time, on your network.',
        );
        const t3 = div(
          't mono',
          { top: '700px', fontSize: '30px', color: '#8db8ff', fontWeight: 500 },
          'kiforsbe.github.io/vidvnc',
        );
        const t4 = div(
          't',
          { top: '756px', fontSize: '26px', color: '#a9b5ca', fontWeight: 400 },
          'Mac and Windows · First release coming soon',
        );
        const ui = [icon, t1, t2, t3, t4];
        return {
          scene,
          cam,
          ui,
          update(lt) {
            pts.position.z = lt * 2.2;
            cam.rotation.z = lt * 0.01;
            ui.forEach((e, i) => {
              const k = ease((lt - 0.3 - i * 0.18) / 0.7);
              e.style.opacity = k;
              e.style.transform = `translateY(${lerp(16, 0, k)}px)`;
            });
          },
        };
      });

      /* ---------- engine ---------- */
      const composer = new EffectComposer(renderer);
      const renderPass = new RenderPass(new THREE.Scene(), new THREE.PerspectiveCamera());
      composer.addPass(renderPass);
      composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.45, 0.5, 0.92));
      composer.addPass(new OutputPass());
      window.DURATION = 20;
      window.render = (t) => {
        for (const s of shots) {
          const on = t >= s.start && t < s.end;
          s.ui.forEach((e) => (e.style.display = on ? '' : 'none'));
          if (!on) continue;
          const lt = t - s.start,
            dur = s.end - s.start;
          s.update(lt);
          renderPass.scene = s.scene;
          renderPass.camera = s.cam;
          composer.render();
          const f = clamp(Math.min(lt / 0.4, (dur - lt) / 0.4));
          renderer.domElement.style.opacity = f;
          UI.style.opacity = f;
        }
      };
      window.ready = document.fonts.ready.then(() => true);
      window.render(Number(new URLSearchParams(location.search).get('t') || 0));
    </script>
  </body>
</html>
