<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VidVNC promo film</title>
    <link rel="icon" href="data:," />
    <style>
    @font-face {
      font-family: "Instrument Sans";
      font-weight: 400 700;
      src: url(assets/fonts/instrument-sans-latin-wght-normal.woff2) format("woff2");
    }
    @font-face {
      font-family: "JetBrains Mono";
      font-weight: 400;
      src: url(assets/fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2");
    }
    @font-face {
      font-family: "JetBrains Mono";
      font-weight: 500;
      src: url(assets/fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2");
    }
    :root {
      --bg: #0a0f1c;
      --accent: #2f6feb;
      --text: #e8edf7;
      --muted: #a9b5ca;
      --faint: #8693ab;
      --border: #1c2740;
    }
    html,
    body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: var(--bg);
    }
    body {
      font-family: "Instrument Sans", system-ui, sans-serif;
      color: var(--text);
    }
    #stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      /* the WebGL backdrop (backdrop.mjs) shows through */
    }
    .abs {
      position: absolute;
    }
    .scene {
      position: absolute;
      inset: 0;
      display: none;
    }
    .title {
      font-weight: 600;
      font-size: 64px;
      letter-spacing: -0.5px;
      text-align: center;
      width: 100%;
    }
    .sub {
      font-size: 30px;
      color: var(--muted);
      text-align: center;
      width: 100%;
    }
    .mono {
      font-family: "JetBrains Mono", monospace;
    }
    .note {
      position: absolute;
      right: 40px;
      bottom: 30px;
      font-size: 24px;
      color: var(--faint);
      letter-spacing: 0.5px;
    }
    .caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 56px;
      text-align: center;
    }
    .caption span {
      display: inline-block;
      padding: 10px 22px;
      border-radius: 12px;
      background: rgba(5, 8, 16, 0.72);
      font-size: 34px;
      font-weight: 500;
      color: #fff;
      max-width: 1500px;
      line-height: 1.3;
    }
    /* Desktop being shared */
    .desk {
      position: absolute;
      width: 1600px;
      height: 1000px;
      overflow: hidden;
      transform-origin: 0 0;
      background: #0a1026;
    }
    .desk .win {
      position: absolute;
      width: 560px;
      height: 473px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
      background-size: cover;
    }
    /* Devices */
    .phone {
      position: absolute;
      background: #05070c;
      border-radius: 64px;
      box-shadow:
        0 0 0 3px #2a3550,
        0 40px 120px rgba(0, 0, 0, 0.6);
    }
    .phone .screen {
      position: absolute;
      inset: 20px;
      border-radius: 46px;
      overflow: hidden;
      background: #000;
    }
    .laptop .lid {
      position: absolute;
      background: #05070c;
      border-radius: 26px 26px 6px 6px;
      box-shadow: 0 0 0 3px #2a3550;
    }
    .laptop .screen {
      position: absolute;
      left: 22px;
      right: 22px;
      top: 22px;
      bottom: 22px;
      overflow: hidden;
      background: #000;
      border-radius: 6px;
    }
    .laptop .base {
      position: absolute;
      background: linear-gradient(#3a4560, #1f2840);
      border-radius: 0 0 26px 26px;
    }
    .shot {
      position: absolute;
      background-size: contain;
      background-repeat: no-repeat;
      border-radius: 22px;
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.55);
    }
    .finger {
      position: absolute;
      width: 54px;
      height: 54px;
      margin: -27px 0 0 -27px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      border: 3px solid rgba(255, 255, 255, 0.85);
    }
    .label {
      position: absolute;
      font-size: 36px;
      font-weight: 600;
      text-align: center;
    }
    .ring {
      position: absolute;
      border: 3px solid var(--accent);
      border-radius: 36px;
    }
    .ring b {
      position: absolute;
      left: 30px;
      top: 16px;
      font-size: 30px;
      font-weight: 600;
      white-space: nowrap;
    }
    .hl {
      position: absolute;
      border: 4px solid var(--accent);
      border-radius: 18px;
      box-shadow:
        0 0 0 9999px rgba(5, 8, 16, 0.45),
        0 0 40px rgba(47, 111, 235, 0.6);
    }
    .cursor {
      position: absolute;
      width: 0;
      height: 0;
    }
    .cursor svg {
      position: absolute;
      left: -4px;
      top: -2px;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.5));
    }
    </style>
    <script type="importmap">
    { "imports": { "three": "/vendor/three/build/three.module.js" } }
    </script>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="/engine/film.mjs"></script>
  </body>
</html>
