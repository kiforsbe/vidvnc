<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VidVNC promo scenes</title>
    <style>
      @font-face {
        font-family: 'Instrument Sans';
        font-weight: 400 700;
        src: url(assets/fonts/instrument-sans-latin-wght-normal.woff2) format('woff2');
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-weight: 400;
        src: url(assets/fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2');
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-weight: 500;
        src: url(assets/fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2');
      }
      :root {
        --bg: #0a0f1c;
        --accent: #2f6feb;
        --text: #e8edf7;
        --muted: #a9b5ca;
        --faint: #8693ab;
        --border: #1c2740;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      body {
        font-family: 'Instrument Sans', system-ui, sans-serif;
        color: var(--text);
      }
      #stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
        /* the WebGL backdrop (backdrop.mjs) shows through */
      }
      .abs {
        position: absolute;
      }
      .scene {
        position: absolute;
        inset: 0;
        display: none;
      }
      .title {
        font-weight: 600;
        font-size: 64px;
        letter-spacing: -0.5px;
        text-align: center;
        width: 100%;
      }
      .sub {
        font-size: 30px;
        color: var(--muted);
        text-align: center;
        width: 100%;
      }
      .mono {
        font-family: 'JetBrains Mono', monospace;
      }
      .note {
        position: absolute;
        right: 40px;
        bottom: 30px;
        font-size: 18px;
        color: var(--faint);
        letter-spacing: 0.5px;
      }
      .caption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 56px;
        text-align: center;
      }
      .caption span {
        display: inline-block;
        padding: 10px 22px;
        border-radius: 12px;
        background: rgba(5, 8, 16, 0.72);
        font-size: 34px;
        font-weight: 500;
        color: #fff;
        max-width: 1500px;
        line-height: 1.3;
      }
      /* Desktop being shared */
      .desk {
        position: absolute;
        width: 1600px;
        height: 1000px;
        overflow: hidden;
        transform-origin: 0 0;
        background: #0a1026;
      }
      .desk .win {
        position: absolute;
        width: 560px;
        height: 473px;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
        background-size: cover;
      }
      /* Devices */
      .phone {
        position: absolute;
        background: #05070c;
        border-radius: 64px;
        box-shadow:
          0 0 0 3px #2a3550,
          0 40px 120px rgba(0, 0, 0, 0.6);
      }
      .phone .screen {
        position: absolute;
        inset: 20px;
        border-radius: 46px;
        overflow: hidden;
        background: #000;
      }
      .laptop .lid {
        position: absolute;
        background: #05070c;
        border-radius: 26px 26px 6px 6px;
        box-shadow: 0 0 0 3px #2a3550;
      }
      .laptop .screen {
        position: absolute;
        left: 22px;
        right: 22px;
        top: 22px;
        bottom: 22px;
        overflow: hidden;
        background: #000;
        border-radius: 6px;
      }
      .laptop .base {
        position: absolute;
        background: linear-gradient(#3a4560, #1f2840);
        border-radius: 0 0 26px 26px;
      }
      .shot {
        position: absolute;
        background-size: contain;
        background-repeat: no-repeat;
        border-radius: 22px;
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.55);
      }
      .finger {
        position: absolute;
        width: 54px;
        height: 54px;
        margin: -27px 0 0 -27px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.35);
        border: 3px solid rgba(255, 255, 255, 0.85);
      }
      .label {
        position: absolute;
        font-size: 36px;
        font-weight: 600;
        text-align: center;
      }
      .ring {
        position: absolute;
        border: 3px solid var(--accent);
        border-radius: 36px;
      }
      .ring b {
        position: absolute;
        left: 30px;
        top: 16px;
        font-size: 30px;
        font-weight: 600;
        white-space: nowrap;
      }
      .hl {
        position: absolute;
        border: 4px solid var(--accent);
        border-radius: 18px;
        box-shadow:
          0 0 0 9999px rgba(5, 8, 16, 0.45),
          0 0 40px rgba(47, 111, 235, 0.6);
      }
      .cursor {
        position: absolute;
        width: 0;
        height: 0;
      }
      .cursor svg {
        position: absolute;
        left: -4px;
        top: -2px;
        filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.5));
      }
    </style>
    <script type="importmap">
      { "imports": { "three": "/vendor/three/build/three.module.js" } }
    </script>
  </head>
  <body>
    <div id="stage"></div>
    <script>
      'use strict';
      const STAGE = document.getElementById('stage');
      const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
      const ease = (x) => {
        x = clamp(x);
        return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
      };
      const lerp = (a, b, x) => a + (b - a) * x;
      const fade = (lt, dur, fi = 0.4, fo = 0.4) =>
        clamp(Math.min(fi ? lt / fi : 1, fo ? (dur - lt) / fo : 1));
      function el(cls, parent, css = {}, html = '') {
        const e = document.createElement('div');
        e.className = cls;
        Object.assign(e.style, css);
        if (html) e.innerHTML = html;
        parent.appendChild(e);
        return e;
      }
      const A = 'assets/';

      /* ---------- the shared desktop, drawn at any moment ---------- */
      // The desktop is a canvas: a wallpaper, a menu bar with a clock, and a music player
      // whose visualiser plays eq.json, the spectrum of the track heard in the film (music.py).
      // Each desk draws at its own clock, so a late desk shows late pictures.
      let EQ = null; // { fps, bands, data: Uint8Array of frames x (bands + 1) }
      const eqReady = fetch('eq.json')
        .then((r) => (r.ok ? r.json() : null))
        .then((j) => {
          if (j) EQ = { ...j, data: Uint8Array.from(atob(j.data), (c) => c.charCodeAt(0)) };
        })
        .catch(() => {});
      function eqAt(time) {
        const n = 49;
        const out = new Float32Array(n);
        if (!EQ) return out;
        const frames = EQ.data.length / n;
        const x = clamp(time * EQ.fps, 0, frames - 1.001);
        const i = Math.floor(x),
          k = x - i;
        for (let b = 0; b < n; b++)
          out[b] = (EQ.data[i * n + b] * (1 - k) + EQ.data[(i + 1) * n + b] * k) / 255;
        return out;
      }
      // The wallpaper is drawn once: deep blue with soft light and silk-like ribbons.
      const WALL = (() => {
        const c = document.createElement('canvas');
        c.width = 1600;
        c.height = 1000;
        const g = c.getContext('2d');
        const bg = g.createLinearGradient(0, 0, 1600, 1000);
        bg.addColorStop(0, '#121a3d');
        bg.addColorStop(0.55, '#1a1446');
        bg.addColorStop(1, '#0a1026');
        g.fillStyle = bg;
        g.fillRect(0, 0, 1600, 1000);
        for (const [x, y, r, col] of [
          [380, 260, 620, '59,91,219'],
          [1250, 780, 680, '112,72,232'],
          [1100, 160, 420, '21,170,191'],
        ]) {
          const rg = g.createRadialGradient(x, y, 0, x, y, r);
          rg.addColorStop(0, `rgba(${col},0.55)`);
          rg.addColorStop(1, `rgba(${col},0)`);
          g.fillStyle = rg;
          g.fillRect(0, 0, 1600, 1000);
        }
        g.globalCompositeOperation = 'screen';
        for (let i = 0; i < 46; i++) {
          const k = i / 45;
          const lg = g.createLinearGradient(0, 0, 1600, 0);
          lg.addColorStop(0, `rgba(77,171,247,0)`);
          lg.addColorStop(0.35, `rgba(77,171,247,${0.05 + 0.1 * Math.sin(k * Math.PI)})`);
          lg.addColorStop(0.7, `rgba(151,117,250,${0.05 + 0.12 * Math.sin(k * Math.PI)})`);
          lg.addColorStop(1, `rgba(151,117,250,0)`);
          g.strokeStyle = lg;
          g.lineWidth = 1.5 + 2.5 * Math.sin(k * Math.PI);
          g.beginPath();
          for (let x = -20; x <= 1620; x += 20) {
            const y =
              560 +
              (k - 0.5) * 260 +
              Math.sin(x / 260 + k * 2.2) * (90 + 60 * k) +
              Math.sin(x / 120 + k * 5) * 18;
            x < 0 ? g.moveTo(x, y) : g.lineTo(x, y);
          }
          g.stroke();
        }
        return c;
      })();
      const rrect = (g, x, y, w, h, r) => {
        g.beginPath();
        g.roundRect(x, y, w, h, r);
      };
      const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
      // The player window, in desk pixels.
      const PL = { x: 860, y: 230, w: 680, h: 640 };
      function drawDesk(g, time) {
        const eq = eqAt(time);
        const level = eq[48];
        g.drawImage(WALL, 0, 0);
        // menu bar and clock
        g.fillStyle = 'rgba(8,12,26,0.6)';
        g.fillRect(0, 0, 1600, 36);
        g.fillStyle = '#e6ebf5';
        g.font = '600 20px "Instrument Sans"';
        g.textBaseline = 'middle';
        g.fillText('Music', 22, 18);
        g.font = '20px "Instrument Sans"';
        ['File', 'Edit', 'View', 'Window'].forEach((m, i) => g.fillText(m, 100 + i * 70, 18));
        const clock = 21 * 3600 + 41 * 60 + 12 + time;
        g.textAlign = 'right';
        g.font = '20px "JetBrains Mono"';
        g.fillText(
          `${Math.floor(clock / 3600) % 24}:${String(Math.floor(clock / 60) % 60).padStart(2, '0')}:${String(Math.floor(clock) % 60).padStart(2, '0')}`,
          1578,
          18,
        );
        g.textAlign = 'left';
        // player window
        const { x, y, w, h } = PL;
        g.save();
        g.shadowColor = 'rgba(0,0,0,0.55)';
        g.shadowBlur = 60;
        g.shadowOffsetY = 24;
        rrect(g, x, y, w, h, 22);
        g.fillStyle = 'rgba(16,20,34,0.92)';
        g.fill();
        g.restore();
        g.save();
        rrect(g, x, y, w, h, 22);
        g.clip();
        // title bar
        g.fillStyle = 'rgba(255,255,255,0.04)';
        g.fillRect(x, y, w, 52);
        ['#ff5f57', '#febc2e', '#28c840'].forEach((c, i) => {
          g.fillStyle = c;
          g.beginPath();
          g.arc(x + 30 + i * 26, y + 26, 8, 0, 7);
          g.fill();
        });
        g.fillStyle = '#a9b5ca';
        g.font = '500 20px "Instrument Sans"';
        g.textAlign = 'center';
        g.fillText('Now Playing', x + w / 2, y + 27);
        g.textAlign = 'left';
        // cover art: glowing rings that breathe with the music
        const ax = x + 36,
          ay = y + 84,
          as = 230;
        const cg = g.createLinearGradient(ax, ay, ax + as, ay + as);
        cg.addColorStop(0, '#3b5bdb');
        cg.addColorStop(0.6, '#7048e8');
        cg.addColorStop(1, '#e64980');
        rrect(g, ax, ay, as, as, 16);
        g.fillStyle = cg;
        g.fill();
        g.save();
        rrect(g, ax, ay, as, as, 16);
        g.clip();
        g.globalCompositeOperation = 'screen';
        for (let r = 0; r < 7; r++) {
          g.strokeStyle = `rgba(255,255,255,${0.1 + 0.25 * level * (1 - r / 7)})`;
          g.lineWidth = 3;
          g.beginPath();
          g.arc(ax + as * 0.5, ay + as * 0.62, 30 + r * 26 + level * 14, 0, 7);
          g.stroke();
        }
        g.restore();
        g.fillStyle = '#fff';
        g.font = '700 30px "Instrument Sans"';
        g.fillText('NIGHT', ax + 22, ay + 44);
        g.fillText('DRIVE', ax + 22, ay + 78);
        // track details
        const tx = ax + as + 34;
        g.fillStyle = '#fff';
        g.font = '600 44px "Instrument Sans"';
        g.fillText('Night Drive', tx, ay + 52);
        g.fillStyle = '#a9b5ca';
        g.font = '28px "Instrument Sans"';
        g.fillText('Demo track', tx, ay + 98);
        g.font = '22px "JetBrains Mono"';
        g.fillStyle = '#8db8ff';
        g.fillText('STEREO', tx, ay + 150);
        // level meters (left and right)
        for (let c = 0; c < 2; c++) {
          const mw = 300 * clamp(level * (c ? 0.97 : 1));
          rrect(g, tx, ay + 178 + c * 26, 300, 12, 6);
          g.fillStyle = 'rgba(255,255,255,0.08)';
          g.fill();
          const mg = g.createLinearGradient(tx, 0, tx + 300, 0);
          mg.addColorStop(0, '#15aabf');
          mg.addColorStop(0.7, '#4dabf7');
          mg.addColorStop(1, '#9775fa');
          rrect(g, tx, ay + 178 + c * 26, Math.max(12, mw), 12, 6);
          g.fillStyle = mg;
          g.fill();
        }
        // spectrum: 48 bars with a soft reflection
        const sx = x + 36,
          sw = w - 72,
          base = y + 500,
          bw = sw / 48;
        const sg = g.createLinearGradient(0, base - 140, 0, base);
        sg.addColorStop(0, '#9775fa');
        sg.addColorStop(0.5, '#4dabf7');
        sg.addColorStop(1, '#15aabf');
        g.save();
        g.shadowColor = 'rgba(77,171,247,0.7)';
        g.shadowBlur = 18;
        g.fillStyle = sg;
        for (let b = 0; b < 48; b++) {
          const bh = 6 + 134 * eq[b];
          rrect(g, sx + b * bw + 2, base - bh, bw - 4, bh, 3);
          g.fill();
        }
        g.restore();
        g.globalAlpha = 0.18;
        g.fillStyle = sg;
        for (let b = 0; b < 48; b++) {
          const bh = (6 + 134 * eq[b]) * 0.35;
          g.fillRect(sx + b * bw + 2, base + 4, bw - 4, bh);
        }
        g.globalAlpha = 1;
        // transport
        const el0 = 72 + time;
        const total = 228;
        const py = y + 570;
        rrect(g, sx, py, sw, 8, 4);
        g.fillStyle = 'rgba(255,255,255,0.12)';
        g.fill();
        rrect(g, sx, py, sw * ((el0 % total) / total), 8, 4);
        g.fillStyle = '#e6ebf5';
        g.fill();
        g.font = '20px "JetBrains Mono"';
        g.fillStyle = '#a9b5ca';
        g.fillText(mmss(el0 % total), sx, py + 36);
        g.textAlign = 'right';
        g.fillText(mmss(total), sx + sw, py + 36);
        g.textAlign = 'left';
        // pause button
        g.fillStyle = '#fff';
        g.fillRect(x + w / 2 - 14, py + 20, 9, 30);
        g.fillRect(x + w / 2 + 5, py + 20, 9, 30);
        g.restore();
      }
      function makeDesk(parent) {
        const root = el('desk', parent);
        const cv = document.createElement('canvas');
        cv.width = 1600;
        cv.height = 1000;
        cv.style.position = 'absolute';
        root.appendChild(cv);
        const win = el('win', root, { backgroundImage: `url(${A}mac/overview-dark.png)` });
        return { root, g: cv.getContext('2d'), win };
      }
      const winPos = (time) => ({
        x: 60 + 200 * (0.5 - 0.5 * Math.cos(time * 1.15)),
        y: 90 + 110 * (0.5 - 0.5 * Math.cos(time * 0.83)),
      });
      function setDesk(d, time) {
        drawDesk(d.g, time);
        const p = winPos(time);
        d.win.style.left = p.x + 'px';
        d.win.style.top = p.y + 'px';
      }

      /* A phone (landscape or portrait) with a desktop on its screen. */
      function makePhone(parent, w, h) {
        const ph = el('phone', parent, { width: w + 'px', height: h + 'px' });
        const screen = el('screen', ph);
        const sw = w - 40,
          sh = h - 40;
        const s = Math.min(sw / 1600, sh / 1000);
        const holder = el('abs', screen, {
          left: (sw - 1600 * s) / 2 + 'px',
          top: (sh - 1000 * s) / 2 + 'px',
          width: 1600 * s + 'px',
          height: 1000 * s + 'px',
          overflow: 'hidden',
        });
        const desk = makeDesk(holder);
        desk.root.style.transform = `scale(${s})`;
        return {
          ph,
          screen,
          holder,
          desk,
          s,
          ox: (sw - 1600 * s) / 2 + 20,
          oy: (sh - 1000 * s) / 2 + 20,
        };
      }
      function makeLaptop(parent, w) {
        const h = w * 0.64;
        const box = el('laptop abs', parent, { width: w + 'px', height: h + 40 + 'px' });
        const lid = el('lid', box, { left: 0, top: 0, width: w + 'px', height: h + 'px' });
        const screen = el('screen', lid);
        el('base', box, { left: '-60px', top: h + 'px', width: w + 120 + 'px', height: '26px' });
        return { box, screen, w, h };
      }
      // Lag model for the traditional client: late, and at a low, uneven frame rate.
      const vncTime = (t) => {
        const step = 0.2 + 0.12 * Math.abs(Math.sin(Math.floor(t * 3)));
        return Math.floor((t - 0.45) / step) * step;
      };
      const vidTime = (t) => t - 0.063;

      function stopwatchText(sec) {
        const m = Math.floor(sec / 60),
          s = Math.floor(sec % 60),
          ms = Math.floor((sec * 1000) % 1000);
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(ms).padStart(3, '0')}`;
      }
      const cursorSvg =
        '<svg width="34" height="44" viewBox="0 0 17 22"><path d="M1 1 L1 17 L5 13 L8 20 L11 19 L8 12 L14 12 Z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>';
      const speakerOn =
        '<svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#e8edf7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#e8edf7"/><path class="w1" d="M16 9a4 4 0 0 1 0 6"/><path class="w2" d="M19 6a8 8 0 0 1 0 12"/></svg>';
      const speakerOff =
        '<svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#8693ab" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#8693ab"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
      const monitorSvg = (c) =>
        `<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="${c}" stroke-width="1.4" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="12.5" rx="1.5"/><path d="M8 20.5h8M12 16.5v4"/></svg>`;

      /* ---------- scenes ---------- */
      const scenes = [];
      function scene(start, end, build, update) {
        scenes.push({ start, end, build, update, root: null, st: null });
      }

      // 1-3: one phone, the lag everyone knows
      scene(
        0,
        12.2,
        (root) => {
          const p = makePhone(root, 1180, 600);
          p.ph.style.left = (1920 - 1180) / 2 + 'px';
          p.ph.style.top = '200px';
          const finger = el('finger', p.ph);
          const text = el(
            'abs',
            root,
            { left: 0, right: 0, top: '880px' },
            '<div class="title">Every frame, a beat behind.</div>',
          );
          el('note', root, {}, 'Illustration');
          return { p, finger, text };
        },
        ({ p, finger, text }, lt, dur, root) => {
          root.style.opacity = fade(lt, dur, 0.6, 0.3);
          const on = ease((lt - 0.6) / 0.6);
          p.screen.style.opacity = on;
          setDesk(p.desk, vncTime(lt));
          p.desk.root.style.filter = 'blur(1.2px) saturate(0.85)';
          const w = winPos(lt);
          finger.style.left = p.ox + (w.x + 280) * p.s + 'px';
          finger.style.top = p.oy + (w.y + 19) * p.s + 'px';
          finger.style.opacity = lt > 3 ? 1 : 0;
          text.style.opacity = ease((lt - 8) / 0.6);
          p.ph.style.transform = `scale(${lerp(1, 0.96, ease((lt - 8) / 1))})`;
        },
      );

      // 4-5: the race
      scene(
        12.2,
        24,
        (root) => {
          const make = (x, label, color, icon) => {
            const p = makePhone(root, 860, 430);
            p.ph.style.left = x + 'px';
            p.ph.style.top = '300px';
            const f = el('finger', p.ph);
            const l = el(
              'label',
              root,
              { left: x + 'px', width: '860px', top: '220px', color },
              label,
            );
            const ic = el('abs', root, { left: x + 403 + 'px', top: '770px' }, icon);
            return { p, f, l, ic };
          };
          const L = make(80, 'Traditional VNC', '#a9b5ca', speakerOff);
          const R = make(980, 'VidVNC', '#8db8ff', speakerOn);
          el('note', root, {}, 'Illustration · the 63 ms figure is measured');
          return { L, R };
        },
        ({ L, R }, lt, dur, root) => {
          root.style.opacity = fade(lt, dur, 0.4, 0.4);
          const t = lt + 12;
          const slide = ease(lt / 0.9);
          L.p.ph.style.transform = `translateX(${lerp(300, 0, slide)}px)`;
          R.p.ph.style.transform = `translateX(${lerp(-300, 0, slide)}px)`;
          [L.l, R.l, L.ic, R.ic].forEach((e) => (e.style.opacity = ease((lt - 0.8) / 0.5)));
          setDesk(L.p.desk, vncTime(t));
          L.p.desk.root.style.filter = 'blur(1.2px) saturate(0.85)';
          setDesk(R.p.desk, vidTime(t));
          const w = winPos(t);
          for (const s of [L, R]) {
            s.f.style.left = s.p.ox + (w.x + 280) * s.p.s + 'px';

          root.style.opacity = fade(lt, dur, 0.4, 0.4);
          const time = lt + 86.2;
          setDesk(d1, time);
          setDesk(tab.desk, time - 0.06);
          setDesk(ph.desk, time - 0.07);
          root.style.transform = `scale(${lerp(1.08, 1, ease(lt / 3))})`;
          t.style.opacity = ease((lt - 1) / 0.6);
        },
      );

      // 15: end card
      scene(
        89.2,
        95.5,
        (root) => {
          el('abs', root, {
            left: '880px',
            top: '250px',
            width: '160px',
            height: '160px',
            background: `url(${A}icon.png) center/contain no-repeat`,
          });
          el(
            'abs',
            root,
            { left: 0, right: 0, top: '450px' },
            '<div class="title" style="font-size:96px">VidVNC</div><div class="sub" style="margin-top:10px;font-size:36px;color:#e8edf7">Your desktop, in real time, on your network.</div>',
          );
          el(
            'abs',
            root,
            { left: 0, right: 0, top: '700px' },
            '<div class="sub mono" style="font-size:30px;color:#8db8ff">kiforsbe.github.io/vidvnc</div><div class="sub" style="margin-top:18px;font-size:26px">Mac and Windows · First release coming soon</div>',
          );
          return {};
        },
        (_, lt, dur, root) => {
          root.style.opacity = fade(lt, dur, 0.6, 0.8);
        },
      );

      /* ---------- engine ---------- */
      for (const s of scenes) {
        s.root = el('scene', STAGE);
        s.st = s.build(s.root);
      }
      window.DURATION = 95.5;
      // The WebGL backdrop only adds depth and glow behind the 2D shots.
      let backdrop = null;
      const backdropLoaded = import('./backdrop.mjs').then((m) => (backdrop = m));
      window.render = function (t) {
        backdrop?.render(t);
        for (const s of scenes) {
          const on = t >= s.start && t < s.end;
          s.root.style.display = on ? 'block' : 'none';
          if (on) s.update(s.st, t - s.start, s.end - s.start, s.root);
        }
      };
      window.ready = Promise.all([
        backdropLoaded,
        eqReady,
        document.fonts.load('20px "Instrument Sans"'),
        document.fonts.load('20px "JetBrains Mono"'),
        document.fonts.ready,
      ]).then(() =>
        Promise.all(
          [
            ...new Set(
              [...document.querySelectorAll('*')]
                .map(
                  (e) =>
                    (getComputedStyle(e).backgroundImage.match(/url\("?([^")]+)"?\)/) || [])[1],
                )
                .filter(Boolean),
            ),
          ].map(
            (u) =>
              new Promise((r) => {
                const i = new Image();
                i.onload = i.onerror = r;
                i.src = u;
              }),
          ),
        ),
      );
      const q = new URLSearchParams(location.search);
      render(Number(q.get('t') || 0));
    </script>
  </body>
</html>
